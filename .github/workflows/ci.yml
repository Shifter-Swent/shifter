# Co-authored-by: Claude Opus 5.5 <noreply@anthropic.com>
name: CI - Test Runner

# Run the workflow when commits are pushed on main or when a PR is modified
on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# The build and unit tests run alongside the instrumented tests, which are split across several
# emulators. Sonar then merges the coverage of all of them, and the "CI" job, the check required
# to merge, reports whether everything passed.
env:
  # How many emulators share the instrumented tests, read only by the sonar job to check it got the
  # coverage of each: keep it equal to the length of the shard list of the instrumented job. The
  # shards themselves take their count from the matrix, so a mismatch fails the sonar job instead
  # of skipping tests.
  SHARDS: 4

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of Sonar analysis

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # A workflow runs in a clean environment every time, so the Gradle folder is cached to avoid
      # downloading and processing the dependencies again.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # Restore local.properties (holding MAPS_API_KEY) from the base64-encoded LOCAL_PROPERTIES
      # secret, so the key never lands in the repository.
      - name: Decode secrets
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          echo "$LOCAL_PROPERTIES" | base64 --decode > ./local.properties

      - name: KTFmt Check
        run: |
          ./gradlew ktfmtCheck

      - name: Assemble
        run: |
          # To run the CI with debug information, add --info
          ./gradlew assemble lint --parallel --build-cache

      - name: Run tests
        run: |
          # To run the CI with debug information, add --info
          ./gradlew check --parallel --build-cache

      # What the sonar job reads: the unit tests' coverage and results, the lint report, and the
      # compiled classes the coverage is reported against. Paths are kept relative to app/build.
      - name: Upload the reports for Sonar
        uses: actions/upload-artifact@v7
        with:
          name: unit-reports
          if-no-files-found: error
          retention-days: 3
          path: |
            app/build/outputs/unit_test_code_coverage/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.xml
            app/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes/
            app/build/intermediates/javac/debug/

  instrumented:
    name: Instrumented tests (${{ matrix.shard }})
    runs-on: ubuntu-latest

    strategy:
      # Every shard runs to the end, so a failure in one still shows the results of the others.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Kernel-based Virtual Machine (KVM) is an open source virtualization technology built into
      # Linux. Enabling it allows the Android emulator to run faster.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Cache the Emulator, if the cache does not hit, create the emulator.
      # API 34 matches targetSdk. compileSdk 37 is only the compile platform. The ATD image is
      # made for tests: lighter, with the Google APIs the Maps and sign-in tests use. The key names
      # the image, so a cached AVD of another image is never reused.
      - name: AVD cache
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_atd

      - name: create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      - name: Decode secrets
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          echo "$LOCAL_PROPERTIES" | base64 --decode > ./local.properties

      # The instrumented repository tests talk to the Firestore emulator instead of the
      # production backend, so the Firebase CLI has to be available on the runner.
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      # Run this shard's part of the connected tests on the emulator. The test runner splits the
      # tests by a hash of their name, so each runs in exactly one shard. The count and the index
      # come from the matrix, so they always agree with the jobs that run.
      #
      # `firebase emulators:exec` starts the Auth and Firestore emulators on the runner (the host),
      # runs the given command, and shuts the emulator down afterwards - also when the tests fail.
      # Each shard has its own runner, so its own Firebase emulators. The Android emulator reaches
      # the host loopback interface through 10.0.2.2 (see FirestoreEmulator).
      - name: run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: firebase emulators:exec --only auth,firestore "./gradlew connectedDebugAndroidTest --parallel --build-cache -Pandroid.testInstrumentationRunnerArguments.numShards=${{ strategy.job-total }} -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ strategy.job-index }}"

      # The count of each shard adds up to all the instrumented tests, each run once.
      - name: Count the tests of this shard
        if: always()
        run: |
          count=$(cat app/build/outputs/androidTest-results/connected/**/*.xml 2>/dev/null | grep -o '<testcase ' | wc -l || true)
          echo "Shard ${{ matrix.shard }} ran $count tests." | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash -O globstar {0}

      # The coverage file alone, so the sonar job finds each shard's in a folder of its own.
      - name: Upload the coverage of this shard
        uses: actions/upload-artifact@v7
        with:
          name: coverage-shard-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 3
          path: app/build/outputs/code_coverage/debugAndroidTest/connected/*/coverage.ec

      - name: Upload the test report of this shard
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-shard-${{ matrix.shard }}
          retention-days: 7
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/

  sonar:
    name: Coverage and Sonar
    needs: [unit, instrumented]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of Sonar analysis

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      - name: Decode secrets
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          echo "$LOCAL_PROPERTIES" | base64 --decode > ./local.properties

      - name: Download the unit reports
        uses: actions/download-artifact@v8
        with:
          name: unit-reports
          path: app/build

      - name: Download the coverage of the shards
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-shard-*
          path: shard-coverage

      # jacocoTestReport reads connected/*/coverage.ec, one level only, along with the unit tests'
      # coverage. The artifacts keep the emulator's folder, so each file is moved up to
      # connected/coverage-shard-N/. Fails when a shard's coverage is missing, which would
      # otherwise only show as a drop in Sonar.
      - name: Place the coverage of each shard
        run: |
          connected=app/build/outputs/code_coverage/debugAndroidTest/connected
          for shard in shard-coverage/coverage-shard-*; do
            mkdir -p "$connected/$(basename "$shard")"
            find "$shard" -name coverage.ec -exec cp {} "$connected/$(basename "$shard")/" \;
          done
          found=$(ls "$connected"/*/coverage.ec | wc -l)
          ls -l "$connected"/*/coverage.ec
          if [ "$found" -ne "$SHARDS" ]; then
            echo "::error::Found the coverage of $found shards out of $SHARDS"
            exit 1
          fi

      - name: Generate Coverage Report
        run: |
          ./gradlew jacocoTestReport

      - name: Upload report to SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --parallel --build-cache

  # The check required to merge. It always runs and fails unless every job passed: a required
  # check that is skipped counts as passed, which would let a PR with a failing test be merged.
  ci:
    name: CI
    needs: [unit, instrumented, sonar]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' > /dev/null
