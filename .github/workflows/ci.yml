# Co-authored-by: Claude Opus 5.5 <noreply@anthropic.com>
name: CI - Test Runner

# Run the workflow when commits are pushed on main or when a PR is modified
on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  ci:
    name: CI
    # Execute the CI on the course's runners
    runs-on: ubuntu-latest

    steps:
      # First step : Checkout the repository on the runner
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of Sonar analysis (if we use Sonar Later)

      # A PR changing only documentation skips the instrumented tests, its slowest part. Only that
      # step is skipped, not the job, so the required "CI" check still completes. The list is strict:
      # any other file (workflows, Gradle, rules, code) runs everything. Pushes on main skip this
      # step, so they always run the whole CI and the Sonar coverage stays complete.
      # On a PR, HEAD is the merge of the PR into main, so HEAD^1 is main and the diff is the PR's
      # changes. --no-renames lists both names of a renamed file, so code renamed to .md still counts
      - name: Detect documentation-only changes
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          docs_only=false
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          if [ -n "$files" ]; then
            docs_only=true
            while IFS= read -r file; do
              case "$file" in
                *.md | docs/* | .github/ISSUE_TEMPLATE/*) ;;
                *) docs_only=false ;;
              esac
            done <<< "$files"
          fi
          echo "Changed files:"
          echo "$files"
          echo "Documentation only: $docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      # Kernel-based Virtual Machine (KVM) is an open source virtualization technology built into Linux. Enabling it allows the Android emulator to run faster.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "21"

      # Caching is a very useful part of a CI, as a workflow is executed in a clean environment every time,
      # this means that one would need to re-download and re-process gradle files for every run. Which is very time consuming.
      #
      # To avoid that, we cache the the gradle folder to reuse it later.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Cache the Emulator, if the cache does not hit, create the emulator.
      # API 34 matches targetSdk. compileSdk 37 is only the compile platform.
      - name: AVD cache
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: create AVD and generate snapshot for caching
        if: steps.changes.outputs.docs_only != 'true' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # Restore local.properties (holding MAPS_API_KEY) from the base64-encoded LOCAL_PROPERTIES
      # secret, so the key never lands in the repository.
      - name: Decode secrets
        env:
          LOCAL_PROPERTIES: ${{ secrets.LOCAL_PROPERTIES }}
        run: |
          echo "$LOCAL_PROPERTIES" | base64 --decode > ./local.properties

      # Check formatting
      - name: KTFmt Check
        run: |
          ./gradlew ktfmtCheck

      # This step builds and lints the debug variant only: the release APK is not tested, and the
      # installable APK comes from apk.yml
      - name: Assemble
        run: |
          # To run the CI with debug information, add --info
          ./gradlew assembleDebug lintDebug --parallel --build-cache

      # Run Unit tests
      - name: Run tests
        run: |
          # To run the CI with debug information, add --info
          ./gradlew check --parallel --build-cache

      # The instrumented repository tests talk to the Firestore emulator instead of the
      # production backend, so the Firebase CLI has to be available on the runner.
      - name: Install Firebase CLI
        if: steps.changes.outputs.docs_only != 'true'
        run: npm install -g firebase-tools@15

      # Run connected tests on the emulator.
      #
      # `firebase emulators:exec` starts the Auth and Firestore emulators on the runner (the host), runs the
      # given command, and shuts the emulator down afterwards - also when the tests fail. The
      # Android emulator reaches the host loopback interface through 10.0.2.2 (see FirestoreEmulator).
      - name: run tests
        if: steps.changes.outputs.docs_only != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: firebase emulators:exec --only auth,firestore "./gradlew connectedCheck --parallel --build-cache"

      # This step generates the coverage report which will be uploaded to sonar
      - name: Generate Coverage Report
        run: |
          ./gradlew jacocoTestReport

      # Upload the various reports to sonar
      - name: Upload report to SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --parallel --build-cache
